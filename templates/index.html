<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemstone Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="text-center mb-5">

        <a href="https://github.com/dhanush947/machine-learning-project"
           class="btn btn-dark btn-lg mb-4"
           target="_blank">

            <i class="bi bi-github"></i>
            View GitHub Repository

        </a>

        <h1 class="display-5 fw-bold">
            💎 Gemstone Price Prediction
        </h1>

        <p class="text-light fs-5">
            Predict the market price of a gemstone using Machine Learning
        </p>

        <img src="{{url_for('static', filename='Image/1.jpg')}}"
             class="rounded-circle shadow profile-img">
    </div>

    <!-- Prediction Form -->

    <div class="card shadow-lg border-0">

        <div class="card-body p-5">

            <form action="{{url_for('predict_datapoint')}}" method="POST">

                <div class="row">

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Carat</label>
                        <input type="number" step="0.01" name="carat" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Depth</label>
                        <input type="number" step="0.01" name="depth" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Table</label>
                        <input type="number" step="0.01" name="table" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Length (x)</label>
                        <input type="number" step="0.01" name="x" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Width (y)</label>
                        <input type="number" step="0.01" name="y" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Height (z)</label>
                        <input type="number" step="0.01" name="z" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label">Cut</label>

                        <select class="form-select" name="cut">

                            <option>Fair</option>
                            <option>Good</option>
                            <option>Very Good</option>
                            <option>Premium</option>
                            <option>Ideal</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-4">

                        <label class="form-label">Color</label>

                        <select class="form-select" name="color">

                            <option>D</option>
                            <option>E</option>
                            <option>F</option>
                            <option>G</option>
                            <option>H</option>
                            <option>I</option>
                            <option>J</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-4">

                        <label class="form-label">Clarity</label>

                        <select class="form-select" name="clarity">

                            <option>I1</option>
                            <option>SI2</option>
                            <option>SI1</option>
                            <option>VS2</option>
                            <option>VS1</option>
                            <option>VVS2</option>
                            <option>VVS1</option>
                            <option>IF</option>

                        </select>

                    </div>

                </div>

                <div class="text-center">

                    <button class="btn btn-primary btn-lg px-5">

                        <i class="bi bi-stars"></i>

                        Predict Price

                    </button>

                </div>

            </form>

        </div>

    </div>

    {% if results %}

    <div class="card shadow-lg border-success mt-5">

        <div class="card-body text-center">

            <h4 class="text-success">

                <i class="bi bi-gem"></i>

                Estimated Gemstone Price

            </h4>

            <h1 class="display-4 fw-bold text-dark">

                $ {{ results }}

            </h1>

            <p class="text-muted">

                Prediction generated using the trained CatBoost + Voting Regressor model.

            </p>

        </div>

    </div>

    {% endif %}

</div>

</body>

</html>
